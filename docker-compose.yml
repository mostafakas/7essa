# التطوير: npm run db:up  (قاعدة البيانات و Redis فقط)
# تشغيل كامل: docker compose --profile full up --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]

  api:
    profiles: [full]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hessa_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["127.0.0.1:4000:4000"]

  web:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_INTERNAL_URL: "http://api:4000" }
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  redisdata:
